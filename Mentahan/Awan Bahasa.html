<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Awan Bahasa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800;900&display=swap">
<style>
/* Konsep tata letak: tiga kolom (navigasi kiri, jalur belajar di tengah, panel progres kanan) di atas permukaan putih susu.
   Aksen biru langit dipakai untuk tombol 3D bertepi, simpul jalur, dan progres. Di layar sempit navigasi pindah ke bawah. */
:root{
  --bg:#F6F9FC; --surface:#FFFFFF; --surface-2:#EDF3F9; --line:#DAE5EF; --line-strong:#C2D3E3;
  --ink:#14304A; --ink-2:#56708A; --ink-3:#8AA0B4;
  --sky:#5DB8F5; --sky-edge:#2E8FD6; --sky-ink:#1273BC; --sky-soft:#DDEFFC; --sky-wash:#EDF6FD; --on-sky:#08263F;
  --ok:#3CC48A; --ok-edge:#23995F; --ok-soft:#E1F7EC; --ok-ink:#137A4B;
  --bad:#EF6B63; --bad-edge:#C74B44; --bad-soft:#FDE9E7; --bad-ink:#B02F28; --on-bad:#2A0A0A;
  --heart:#F0576A; --flame:#F59A3D;
  --font-display:'Fredoka','Nunito',system-ui,sans-serif;
  --font-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --shadow:0 1px 0 rgba(20,48,74,.04),0 10px 28px rgba(20,48,74,.07);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1823; --surface:#152433; --surface-2:#1B2E40; --line:#25394D; --line-strong:#33495F;
  --ink:#EAF2F9; --ink-2:#9DB3C6; --ink-3:#6F879B;
  --sky-ink:#7CC7F8; --sky-soft:#1B3A55; --sky-wash:#16304A;
  --ok-soft:#12362B; --ok-ink:#6FE0AE; --bad-soft:#3B1A1D; --bad-ink:#FF9A94;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 28px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1823; --surface:#152433; --surface-2:#1B2E40; --line:#25394D; --line-strong:#33495F;
  --ink:#EAF2F9; --ink-2:#9DB3C6; --ink-3:#6F879B;
  --sky-ink:#7CC7F8; --sky-soft:#1B3A55; --sky-wash:#16304A;
  --ok-soft:#12362B; --ok-ink:#6FE0AE; --bad-soft:#3B1A1D; --bad-ink:#FF9A94;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 28px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-weight:600;font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--font-display);font-weight:600;text-wrap:balance;line-height:1.2}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:10px}
.ic{display:block;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* kerangka */
.app{display:grid;grid-template-columns:248px minmax(0,1fr) 360px;max-width:1280px;margin:0 auto;min-height:100dvh}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100dvh;padding:22px 14px;border-right:2px solid var(--line);display:flex;flex-direction:column;gap:6px}
.logo{display:flex;align-items:center;gap:8px;padding:0 8px 18px;font:700 32px/1 var(--font-display);color:var(--sky-ink);letter-spacing:-.01em}
.nav-item{display:flex;align-items:center;gap:16px;padding:11px 14px;border:2px solid transparent;border-radius:14px;
  font-weight:800;font-size:13.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.nav-item:hover{background:var(--surface-2)}
.nav-item[aria-current="page"]{background:var(--sky-wash);border-color:var(--sky);color:var(--sky-ink)}
.main{min-width:0;--tb:0px;padding:0 24px 48px}
.main-in{max-width:640px;margin:0 auto}
.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;max-height:100dvh;overflow:auto;padding:24px 0 24px 24px;display:flex;flex-direction:column;gap:18px}
.topbar{display:none;position:sticky;top:env(safe-area-inset-top,0px);z-index:15;height:56px;background:var(--bg);align-items:center;justify-content:space-between;gap:12px}
.topbar .logo{padding:0;font-size:26px;display:none}

/* statistik */
.stats{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stat{display:flex;align-items:center;gap:6px;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.stat.flame{color:var(--flame)}.stat.gem{color:var(--sky-ink)}.stat.heart{color:var(--heart)}
.stat.off{color:var(--ink-3)}
.course{display:grid;place-items:center;width:38px;height:28px;border-radius:8px;background:var(--sky-soft);color:var(--sky-ink);font-weight:900;font-size:12px;letter-spacing:.06em}

/* kartu dan tombol */
.card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:18px 20px}
.card h3{font-size:19px}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:14px}
.link{font-weight:900;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--sky-ink);background:none;border:0;padding:0}
.link:hover{text-decoration:underline}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 20px;
  font-weight:900;font-size:14px;letter-spacing:.07em;text-transform:uppercase;transition:transform .08s,box-shadow .08s,filter .15s}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 transparent!important}
.btn-primary{background:var(--sky);color:var(--on-sky);box-shadow:0 4px 0 var(--sky-edge)}
.btn-primary:hover:not(:disabled){filter:brightness(1.04)}
.btn-soft{background:var(--surface);color:var(--sky-ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn-bad{background:var(--bad);color:var(--on-bad);box-shadow:0 4px 0 var(--bad-edge)}
.btn-ghost{background:transparent;color:var(--ink-2);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn-onsky{background:rgba(255,255,255,.3);color:var(--on-sky);border:2px solid rgba(8,38,63,.25);box-shadow:0 4px 0 rgba(8,38,63,.2)}
.btn:disabled{background:var(--surface-2);color:var(--ink-3);box-shadow:none;border:0;cursor:not-allowed}
.btn.block{width:100%}
.icon-btn{display:grid;place-items:center;width:40px;height:40px;border:0;background:none;color:var(--ink-3);border-radius:12px}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.bar{height:16px;border-radius:8px;background:var(--surface-2);position:relative;overflow:hidden}
.bar>i{position:absolute;inset:0 auto 0 0;background:var(--sky);border-radius:8px;transition:width .4s ease;min-width:0}
.bar>i::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:2px;background:rgba(255,255,255,.4)}
.bar>b{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:900;color:var(--ink-2);font-variant-numeric:tabular-nums}

/* banner unit dan jalur */
.banner{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--tb));z-index:10;margin-top:4px;background:var(--sky);color:var(--on-sky);
  border-radius:18px;padding:16px 18px 16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 4px 0 var(--sky-edge)}
.banner .eb{display:flex;align-items:center;gap:6px;font-weight:900;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.banner h2{font-size:21px;margin-top:2px}
.banner .btn{flex:none;padding:12px 14px}
.unit-sep{display:flex;align-items:center;gap:14px;margin:28px 0 4px;color:var(--ink-2);font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.unit-sep::before,.unit-sep::after{content:"";flex:1;height:2px;background:var(--line);border-radius:1px}
.unit-sep span{text-align:center;text-wrap:balance}
.path{display:flex;flex-direction:column;align-items:center;gap:22px;padding:76px 0 30px}
.node{--k:1;position:relative;transform:translateX(calc(var(--dx) * var(--k) * 1px))}
.node-btn{display:grid;place-items:center;width:76px;height:68px;border-radius:50%;border:0;background:var(--sky);color:var(--on-sky);
  box-shadow:0 6px 0 var(--sky-edge);transition:transform .08s,box-shadow .08s}
.node-btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--sky-edge)}
.node.done .node-btn{background:var(--sky-edge);color:#fff;box-shadow:0 6px 0 #1F6CAA}
.node.locked .node-btn{background:var(--surface-2);color:var(--ink-3);box-shadow:0 6px 0 var(--line-strong)}
.node.current .node-btn::before{content:"";position:absolute;inset:-9px -9px -12px;border-radius:50%;border:5px solid var(--sky-soft);pointer-events:none}
.node.shake .node-btn{animation:shake .35s}
.bubble{position:absolute;left:50%;bottom:calc(100% + 18px);transform:translateX(-50%);background:var(--surface);border:2px solid var(--line);border-radius:14px;
  padding:7px 16px;font-weight:900;font-size:14px;letter-spacing:.07em;color:var(--sky-ink);white-space:nowrap}
.bubble::after{content:"";position:absolute;left:50%;top:100%;width:12px;height:12px;background:var(--surface);border:2px solid var(--line);border-top:0;border-left:0;transform:translate(-50%,-6px) rotate(45deg)}
.mascot-slot{position:absolute;top:-14px;width:92px;pointer-events:none}
.mascot-slot.right{left:calc(100% + 34px)}.mascot-slot.left{right:calc(100% + 34px)}
@media (prefers-reduced-motion:no-preference){
  .bubble{animation:bobx 1.8s ease-in-out infinite}
  .mascot-slot svg{animation:bob 2.6s ease-in-out infinite}
}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes bobx{50%{transform:translateX(-50%) translateY(-5px)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}


/* halaman pendukung */
.page-head{padding:28px 0 18px}
.page-head h1{font-size:30px}
.page-head p{color:var(--ink-2);margin-top:4px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:14px;min-width:0}
.row>.grow{flex:1;min-width:0}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.lock-badge{flex:none;width:52px}
.mission{display:grid;grid-template-columns:48px minmax(0,1fr) auto;align-items:center;gap:14px}
.mission h3{font-size:17px;margin-bottom:8px}
.m-ico{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;background:var(--sky-soft);color:var(--sky-ink)}
.reward{display:inline-flex;align-items:center;gap:4px;font-weight:900;color:var(--sky-ink);font-size:14px}
.lb-row{display:grid;grid-template-columns:28px 44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;border-radius:14px}
.lb-row.me{background:var(--sky-wash);outline:2px solid var(--sky)}
.lb-row .rk{font-weight:900;color:var(--ink-3);text-align:center;font-variant-numeric:tabular-nums}
.lb-row .nm{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-row .xp{font-weight:800;color:var(--ink-2);font-variant-numeric:tabular-nums}
.avatar{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;font:700 18px var(--font-display);color:var(--on-sky);background:var(--sky)}
.avatar.a2{background:#9ED8FB}.avatar.a3{background:#2E8FD6;color:#fff}.avatar.a4{background:#B9CFE2}
.zone{margin:6px 0;padding:6px 16px;font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--ok-ink);display:flex;align-items:center;gap:10px}
.zone::after{content:"";flex:1;height:2px;background:var(--ok-soft)}
.word{display:grid;grid-template-columns:72px minmax(0,1fr) auto;align-items:center;gap:16px}
.word .th{width:72px;height:72px;border-radius:16px;background:var(--sky-wash);display:grid;place-items:center;color:var(--sky-ink)}
.word .th svg{width:60px;height:60px}
.word h3{font-size:22px}
.ipa{font-family:var(--font-body);font-weight:700;color:var(--ink-2);font-size:14px}
.shop-item{display:grid;grid-template-columns:56px minmax(0,1fr);gap:14px;align-items:center}
.shop-item .m-ico{width:56px;height:56px}
.shop-item .btn{grid-column:1/-1}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{border:2px solid var(--line);border-radius:16px;padding:14px 16px;background:var(--surface)}
.tile b{display:block;font:600 26px var(--font-display);font-variant-numeric:tabular-nums}
.tile span{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.big-avatar{width:84px;height:84px;font-size:36px}
.field{width:100%;padding:14px 16px;border:2px solid var(--line);border-radius:14px;background:var(--surface-2);font-weight:700;font-size:17px;outline:0}
.field:focus{border-color:var(--sky);background:var(--surface)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{padding:10px 16px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:800;color:var(--ink-2)}
.seg button[aria-pressed="true"]{border-color:var(--sky);background:var(--sky-wash);color:var(--sky-ink)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch button{width:52px;height:30px;border-radius:15px;border:0;background:var(--line-strong);position:relative;transition:background .15s}
.switch button::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.switch button[aria-checked="true"]{background:var(--sky)}
.switch button[aria-checked="true"]::after{transform:translateX(22px)}
.guide-sec{margin-top:18px}
.guide-sec h4{margin:0 0 8px;font:800 12.5px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.guide-row{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:2px solid var(--line)}
.guide-row:last-child{border-bottom:0}
.guide-row b{font-weight:800}
.tip{background:var(--sky-wash);border-radius:14px;padding:12px 14px;color:var(--ink);margin-top:10px}

/* pelajaran */
.lesson{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px)}
.l-head{display:flex;align-items:center;gap:16px;width:100%;max-width:1000px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.prog{flex:1;height:16px;border-radius:8px;background:var(--surface-2);position:relative;overflow:hidden}
.prog>i{position:absolute;inset:0 auto 0 0;width:0;border-radius:8px;background:var(--sky);transition:width .35s ease}
.prog>i::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:2px;background:rgba(255,255,255,.4)}
.l-body{flex:1;min-height:0;overflow:auto;padding:20px max(16px,env(safe-area-inset-left,0px)) 24px}
.l-inner{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.chip-label{display:inline-flex;align-items:center;gap:8px;font-weight:900;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--sky-ink)}
.chip-label i{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--sky-soft)}
.q-title{font-size:clamp(22px,4vw,30px)}
.opt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.opt{display:flex;flex-direction:column;gap:12px;text-align:left;padding:16px;border-radius:16px;background:var(--surface);
  border:2px solid var(--line);border-bottom-width:5px;font-weight:800;font-size:16px;transition:background .12s,border-color .12s}
.opt:hover:not(:disabled){background:var(--surface-2)}
.opt[aria-pressed="true"]{border-color:var(--sky);background:var(--sky-wash);color:var(--sky-ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok-ink)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad-ink)}
.opt-art{display:grid;place-items:center;height:130px}
.opt-art svg{height:120px;width:120px;max-width:100%}
.opt-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.opt-list{display:flex;flex-direction:column;gap:12px}
.opt-list .opt{flex-direction:row;align-items:center}
kbd{display:grid;place-items:center;min-width:26px;height:26px;border:2px solid var(--line);border-radius:8px;font:800 12px var(--font-body);color:var(--ink-3)}
.say{display:flex;align-items:center;gap:14px}
.say-bubble{position:relative;display:flex;align-items:center;gap:10px;padding:14px 18px;border:2px solid var(--line);border-radius:16px;background:var(--surface);font-size:18px;font-weight:700;min-width:0}
.say-bubble::before{content:"";position:absolute;left:-9px;top:50%;width:14px;height:14px;background:var(--surface);border:2px solid var(--line);border-top:0;border-right:0;transform:translateY(-50%) rotate(45deg)}
.spk{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:12px;border:0;background:var(--sky);color:var(--on-sky);box-shadow:0 3px 0 var(--sky-edge)}
.answer{min-height:122px;padding:6px 0;display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px;
  background:repeating-linear-gradient(to bottom,transparent 0,transparent 55px,var(--line) 55px,var(--line) 57px)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:56px}
.tok{padding:10px 16px;border-radius:14px;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;font-weight:800;font-size:17px}
.tok:hover{background:var(--surface-2)}
.tok.ghost{background:var(--surface-2);border-color:transparent;color:transparent;pointer-events:none}
.type-art{display:grid;place-items:center}.type-art svg{width:130px;height:130px}
.pairs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pairs .col{display:flex;flex-direction:column;gap:12px}
.pair{padding:14px 12px;border-radius:14px;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;font-weight:800;font-size:16px;text-align:center;overflow-wrap:anywhere}
.pair[aria-pressed="true"]{border-color:var(--sky);background:var(--sky-wash);color:var(--sky-ink)}
.pair.matched{opacity:.35;pointer-events:none;border-color:var(--ok)}
.pair.flash{border-color:var(--bad);background:var(--bad-soft);color:var(--bad-ink)}
.l-foot{border-top:2px solid var(--line);padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));transition:background .15s}
.l-foot.ok{background:var(--ok-soft);border-color:transparent}
.l-foot.bad{background:var(--bad-soft);border-color:transparent}
.l-foot-in{display:flex;align-items:center;justify-content:space-between;gap:16px;max-width:1000px;margin:0 auto;min-height:56px}
.fb{display:flex;align-items:center;gap:14px;flex:1;min-width:0}
.fb .dot{flex:none;display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--surface)}
.fb h3{font-size:22px}
.l-foot.ok .fb{color:var(--ok-ink)}.l-foot.ok .dot{color:var(--ok-edge)}
.l-foot.bad .fb{color:var(--bad-ink)}.l-foot.bad .dot{color:var(--bad-edge)}
.fb p{font-weight:800;font-size:15px;overflow-wrap:anywhere}
.l-foot.ok .btn-primary{background:var(--ok);box-shadow:0 4px 0 var(--ok-edge)}
.l-foot .btn{min-width:130px}
.done-wrap{text-align:center;align-items:center;padding-top:4vh}
.done-wrap .stats-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%}
.done-wrap .tile{text-align:center}
.confirm{position:absolute;inset:0;background:rgba(8,24,40,.5);display:grid;place-items:center;padding:16px}

/* modal dan toast */
.modal-bg{position:fixed;inset:0;z-index:60;background:rgba(8,24,40,.5);display:grid;place-items:center;padding:16px}
.modal{width:100%;max-width:480px;max-height:90dvh;overflow:auto;background:var(--surface);border-radius:24px;padding:24px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:16px}
.modal h2{font-size:26px}
.modal .center{display:grid;place-items:center}
.modal-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;max-width:min(92vw,420px);
  padding:12px 18px;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:800;text-align:center}

.topbar .stats{gap:16px}
/* responsif */
@media (max-width:1080px){
  .app{grid-template-columns:248px minmax(0,1fr)}
  .rail{display:none}
  .topbar{display:flex}
  .main{--tb:56px}
}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;flex-direction:row;justify-content:space-around;gap:2px;z-index:20;
    background:var(--surface);border-right:0;border-top:2px solid var(--line);
    padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px))}
  .side .logo{display:none}
  .topbar .logo{display:flex}
  .nav-item{padding:10px;justify-content:center;flex:1}
  .nav-item span{display:none}
  .main{padding:0 0 96px}
  .toast{bottom:calc(88px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:560px){
  .node{--k:.62}
  .mascot-slot{width:64px;top:-6px}
  .mascot-slot.right{left:calc(100% + 18px)}.mascot-slot.left{right:calc(100% + 18px)}
  .banner h2{font-size:18px}
  .banner .btn span{display:none}
  .l-foot .btn{min-width:0}
  .l-foot-in{gap:10px}
  .fb h3{font-size:18px}
  .word{grid-template-columns:56px minmax(0,1fr) auto}
  .word .th{width:56px;height:56px}.word .th svg{width:46px;height:46px}
}

/* status tersimpan */
const KEY='awan-bahasa-v1';
const ymd=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const ts=s=>{const[p,m,d]=s.split('-').map(Number);return Date.UTC(p,m-1,d)};
const dayDiff=(a,b)=>Math.round((ts(b)-ts(a))/864e5);
const DEF=()=>({name:'',xp:0,gems:500,hearts:5,streak:0,lastDay:'',shield:0,done:{},chests:{},lessons:0,correct:0,answered:0,goal:10,day:ymd(),dXp:0,dLessons:0,dCorrect:0,claimed:{},sound:true});
let S=DEF();
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(DEF(),JSON.parse(raw))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
(function rollDay(){
 const t=ymd();if(S.day===t)return;
 S.day=t;S.dXp=0;S.dLessons=0;S.dCorrect=0;S.claimed={};S.hearts=Math.max(S.hearts,5);
 if(S.lastDay){const d=dayDiff(S.lastDay,t);if(d>=2){if(d===2&&S.shield>0)S.shield--;else S.streak=0}}
 save();
})();

const isDone=i=>{const n=ORDER[i].n;return n.type==='chest'?!!S.chests[n.id]:(S.done[n.id]||0)>0};
const unlocked=i=>i===0||isDone(i-1);
const curIdx=()=>{for(let i=0;i<ORDER.length;i++)if(!isDone(i))return i;return -1};

/* bunyi dan suara */
let AC=null,tt=null;
function tone(f,d,type='sine',v=.06,at=0){
 if(!S.sound)return;
 try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+at;
  o.type=type;o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d)}catch(e){}
}
const sfx={ok:()=>{tone(660,.12);tone(880,.2,'sine',.06,.1)},bad:()=>tone(220,.28,'triangle',.08),done:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.2,'sine',.06,i*.11))}};
function speak(text,lang){
 try{const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}
 catch(e){toast('Suara tidak tersedia di perangkat ini.')}
}
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{t.hidden=true},2600)}

 return rows.sort((a,b)=>b.x-a.x||(a.me?-1:1));

/* mesin pelajaran */
let L=null;
const norm=s=>s.toLowerCase().replace(/[.,!?'’"“”]/g,'').replace(/\s+/g,' ').trim();
const words=s=>s.replace(/[.,!?]/g,'').split(/\s+/).filter(Boolean);
const trophyQs=()=>shuffle(UNITS[0].nodes.filter(n=>n.type==='lesson').flatMap(n=>n.qs)).slice(0,8);

function startLesson(node){
 if(S.hearts<=0){openNoHearts();return}
 const qs=node.type==='trophy'?trophyQs():node.qs;
 L={node,total:qs.length,queue:qs.map(x=>({...x})),fin:0,ok:0,miss:0,t0:Date.now(),state:'ask',cur:null,sel:null,picked:[],pm:{l:null,r:null,n:0}};
 $('#lesson').innerHTML=`<div class="lesson" role="dialog" aria-modal="true" aria-label="Pelajaran">
  <div class="l-head"><button class="icon-btn" data-l="quit" aria-label="Keluar dari pelajaran">${ic('x',26)}</button><div class="prog"><i id="l-fill"></i></div><span class="stat heart">${ic('heart')}<span id="l-hearts">${S.hearts}</span></span></div>
  <div class="l-body"><div class="l-inner" id="l-q"></div></div>
  <div class="l-foot" id="l-foot"><div class="l-foot-in"><button class="btn btn-ghost" data-l="skip" id="l-skip">Lompati</button><div class="fb" id="l-fb"></div><button class="btn btn-primary" id="l-btn" data-l="check" disabled>Periksa</button></div></div></div>`;
 nextQ();
}
function nextQ(){
 if(!L.queue.length){finish();return}
 const x=L.cur=L.queue.shift();L.state='ask';L.sel=null;L.picked=[];L.pm={l:null,r:null,n:0};
 if(x.t==='img')x._o=shuffle(x.opts);
 if(x.t==='pick')x._o=shuffle([x.ans,...x.wrong]);
 if(x.t==='bank')x._tk=shuffle([...words(x.en),...x.extra].map((w,i)=>({i,w})));
 if(x.t==='pairs'){x._l=shuffle(x.p.map((p,i)=>({i,w:p[0]})));x._r=shuffle(x.p.map((p,i)=>({i,w:p[1]})))}
 drawQ(x);setFoot('ask');updateProg();
}
function drawQ(x){
 let h='';
 const lab=(t,i)=>`<div class="chip-label"><i>${ic(i,15)}</i>${t}</div>`;
 if(x.t==='img')h=lab('Kosakata baru','sparkle')+`<h1 class="q-title">Mana yang artinya “${esc(V[x.key].id)}”?</h1><div class="opt-grid">${x._o.map((o,i)=>`<button class="opt" data-l="opt" data-v="${o}" aria-pressed="false"><span class="opt-art">${art(o)}</span><span class="opt-row"><span>${V[o].en}</span><kbd>${i+1}</kbd></span></button>`).join('')}</div>`;
 if(x.t==='pick')h=lab('Pilih jawaban','sparkle')+`<h1 class="q-title">${esc(x.prompt)}</h1><div class="opt-list">${x._o.map((o,i)=>`<button class="opt" data-l="opt" data-v="${esc(o)}" aria-pressed="false"><kbd>${i+1}</kbd><span>${esc(o)}</span></button>`).join('')}</div>`;
 if(x.t==='bank')h=lab('Terjemahkan','sparkle')+`<h1 class="q-title">Tulis dalam bahasa Inggris</h1><div class="say">${mascot('happy',84)}<div class="say-bubble"><button class="spk" data-l="say" data-t="${esc(x.id)}" aria-label="Dengarkan kalimat">${ic('speaker',20)}</button><span>${esc(x.id)}</span></div></div><div class="answer" id="l-ans"></div><div class="bank" id="l-bank"></div>`;
 if(x.t==='type')h=lab('Tulis jawabanmu','sparkle')+`<h1 class="q-title">${esc(x.prompt)}</h1>${x.key?`<div class="type-art">${art(x.key)}</div>`:''}<label class="sr" for="typed">Jawaban</label><input class="field" id="typed" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Ketik dalam bahasa Inggris">`;
 if(x.t==='pairs')h=lab('Cocokkan','sparkle')+`<h1 class="q-title">Pasangkan artinya</h1><div class="pairs"><div class="col">${x._l.map(o=>`<button class="pair" data-l="pair" data-s="l" data-i="${o.i}" aria-pressed="false">${esc(o.w)}</button>`).join('')}</div><div class="col">${x._r.map(o=>`<button class="pair" data-l="pair" data-s="r" data-i="${o.i}" aria-pressed="false">${esc(o.w)}</button>`).join('')}</div></div>`;
 $('#l-q').innerHTML=h;
 if(x.t==='bank')drawBank();
 if(x.t==='type')$('#typed').focus();
 $('.l-body').scrollTop=0;
}
function drawBank(){
 const x=L.cur,used=new Set(L.picked.map(t=>t.i));
 $('#l-ans').innerHTML=L.picked.map(t=>`<button class="tok" data-l="untok" data-i="${t.i}">${esc(t.w)}</button>`).join('');
 $('#l-bank').innerHTML=x._tk.map(t=>used.has(t.i)?`<span class="tok ghost">${esc(t.w)}</span>`:`<button class="tok" data-l="tok" data-i="${t.i}">${esc(t.w)}</button>`).join('');
 enable(L.picked.length>0);
}
const enable=b=>{const e=$('#l-btn');if(e&&L.state==='ask')e.disabled=!b};
function setFoot(st,correct){
 const f=$('#l-foot'),fb=$('#l-fb'),b=$('#l-btn'),sk=$('#l-skip');
 f.className='l-foot'+(st==='ok'||st==='bad'?' '+st:'');
 if(st==='ask'){fb.innerHTML='';sk.hidden=false;b.textContent='Periksa';b.className='btn btn-primary';b.dataset.l='check';b.disabled=!(L.cur&&L.cur.t==='pairs'?false:L.picked.length>0||L.sel!=null);if(L.cur.t==='pairs')b.hidden=true;else b.hidden=false;return}
 b.hidden=false;sk.hidden=true;b.disabled=false;b.textContent='Lanjut';b.dataset.l='next';
 b.className='btn '+(st==='ok'?'btn-primary':'btn-bad');
 const praise=['Bagus!','Tepat sekali!','Hebat!','Keren!'][Math.floor(Math.random()*4)];
 fb.innerHTML=st==='ok'?`<span class="dot">${ic('check',28)}</span><h3>${praise}</h3>`:`<span class="dot">${ic('x',28)}</span><div><h3>Jawaban yang benar:</h3><p>${esc(correct||'')}</p></div>`;
}
function updateProg(){$('#l-fill').style.width=Math.min(100,L.fin/L.total*100)+'%';$('#l-hearts').textContent=S.hearts}
function resolve(ok,correct,skipped){
 const x=L.cur;L.state='done';S.answered++;
 if(ok){L.ok++;L.fin++;S.correct++;S.dCorrect++;sfx.ok()}
 else{L.miss++;if(!skipped){S.hearts=Math.max(0,S.hearts-1);sfx.bad()}if(x.t!=='pairs')L.queue.push({...x})}
 save();setFoot(ok?'ok':'bad',correct);updateProg();renderTop();renderRail();
 $$('#l-q .opt').forEach(o=>{o.disabled=true;if(x.t==='img'&&o.dataset.v===x.key||x.t==='pick'&&o.dataset.v===x.ans)o.classList.add('right');else if(o.getAttribute('aria-pressed')==='true')o.classList.add('wrong')});
 $$('#l-q .tok').forEach(t=>t.disabled=true);
 const ti=$('#typed');if(ti)ti.readOnly=true;
}
function check(){
 if(!L||L.state!=='ask')return;const x=L.cur;let ok=false,cor='';
 if(x.t==='img'){if(!L.sel)return;ok=L.sel===x.key;cor=V[x.key].en}
 else if(x.t==='pick'){if(!L.sel)return;ok=L.sel===x.ans;cor=x.ans}
 else if(x.t==='bank'){if(!L.picked.length)return;ok=norm(L.picked.map(t=>t.w).join(' '))===norm(x.en);cor=x.en}
 else if(x.t==='type'){const v=$('#typed').value;if(!v.trim())return;ok=norm(v)===norm(x.en);cor=x.en}
 resolve(ok,cor,false);
}
function skip(){if(!L||L.state!=='ask')return;const x=L.cur;resolve(false,x.t==='img'?V[x.key].en:x.t==='pairs'?x.p.map(p=>p[0]+' = '+p[1]).join(', '):x.t==='pick'?x.ans:x.en,true)}
function next(){
 if(!L||L.state==='ask')return;
 if(S.hearts<=0){endLesson();openNoHearts();return}
 nextQ();
}
function onPair(el){
 if(!L||L.state!=='ask'||L.cur.t!=='pairs')return;
 const s=el.dataset.s,pm=L.pm;
 if(pm[s]===el){pm[s]=null;el.setAttribute('aria-pressed','false');return}
 if(pm[s])pm[s].setAttribute('aria-pressed','false');
 pm[s]=el;el.setAttribute('aria-pressed','true');
 if(pm.l&&pm.r){
  const a=pm.l,b=pm.r;pm.l=pm.r=null;
  if(a.dataset.i===b.dataset.i){[a,b].forEach(e=>{e.classList.add('matched');e.setAttribute('aria-pressed','false')});pm.n++;sfx.ok();
   if(pm.n===L.cur.p.length)setTimeout(()=>{if(L&&L.state==='ask')resolve(true,'')},250)}
  else{L.miss++;sfx.bad();[a,b].forEach(e=>{e.classList.add('flash');setTimeout(()=>{e.classList.remove('flash');e.setAttribute('aria-pressed','false')},450)})}
 }
}
function finish(){
 const n=L.node,first=!S.done[n.id],perfect=L.miss===0,xp=(first?10:5)+(perfect?5:0),sec=Math.round((Date.now()-L.t0)/1000);
 const acc=Math.round(L.ok/Math.max(1,L.ok+L.miss)*100),t=ymd();let streakUp=false;
 S.xp+=xp;S.dXp+=xp;S.done[n.id]=(S.done[n.id]||0)+1;S.lessons++;S.dLessons++;
 if(S.lastDay!==t){S.streak=(S.lastDay&&dayDiff(S.lastDay,t)<=2)?S.streak+1:1;S.lastDay=t;streakUp=true}
 save();sfx.done();$('#l-fill').style.width='100%';
 $('#lesson').innerHTML=`<div class="lesson"><div class="l-body"><div class="l-inner done-wrap">${mascot('cheer',160)}<h1 class="q-title">${perfect?'Pelajaran sempurna!':'Pelajaran selesai!'}</h1>
  ${streakUp?`<p class="reward" style="font-size:16px">${ic('flame',22)} Runtutan ${S.streak} hari</p>`:''}
  <div class="stats-3"><div class="tile"><b style="color:var(--sky-ink)">+${xp}</b><span>XP</span></div><div class="tile"><b>${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}</b><span>Waktu</span></div><div class="tile"><b>${acc}%</b><span>Akurasi</span></div></div></div></div>
  <div class="l-foot"><div class="l-foot-in" style="justify-content:flex-end"><button class="btn btn-primary" data-l="close" style="min-width:160px">Lanjut</button></div></div></div>`;
 L.state='end';
}

  <button class="btn btn-primary block" data-l="stay">Terus belajar</button><button class="btn btn-ghost block" data-l="leave">Keluar</button></div></div>`);

  <button class="btn btn-primary block" data-act="refill" ${can?'':'disabled'}>${can?'Isi ulang · 350 permata':'Permata kurang'}</button><button class="btn btn-ghost block" data-act="close">Tutup</button>`);
}
function onNode(gi,el){
 const n=ORDER[gi].n;
 if(!unlocked(gi)){const nd=el.closest('.node');nd.classList.remove('shake');void nd.offsetWidth;nd.classList.add('shake');toast('Selesaikan langkah sebelumnya dulu.');return}
 if(n.type==='chest'){
  if(S.chests[n.id]){toast('Peti ini sudah dibuka.');return}
  S.chests[n.id]=1;S.gems+=n.gems;save();sfx.done();refresh();
  modal(`<div class="center" style="color:var(--sky-ink)">${ic('chest',80)}</div><h2 style="text-align:center">Peti terbuka!</h2><p class="reward" style="justify-content:center;font-size:20px">${ic('gem',24)} +${n.gems} permata</p><button class="btn btn-primary block" data-act="close">Ambil</button>`);
  return;
 }
 startLesson(n);
}
function openGuide(ui){
 const u=UNITS[ui]||UNITS[0];
 modal(`<div class="modal-top"><h2>${esc(u.title)}</h2><button class="icon-btn" data-act="close" aria-label="Tutup">${ic('x')}</button></div>`+
  u.guide.map(g=>`<div class="guide-sec"><h4>${g.h}</h4>${g.rows.map(r=>`<div class="guide-row"><b>${esc(r[0])}</b><span class="muted">${esc(r[1])}</span></div>`).join('')}</div>`).join('')+`<div class="tip">${esc(u.tip)}</div>`);
}
function openProfile(){
 modal(`<h2>${S.name?'Ubah profil':'Buat profil'}</h2><p class="muted">Namamu tampil di papan skor. Progres disimpan di peramban ini.</p>
  <label class="sr" for="prof-name">Nama panggilan</label><input class="field" id="prof-name" maxlength="20" value="${esc(S.name)}" placeholder="Nama panggilan"><button class="btn btn-primary block" data-act="saveprofile">Simpan</button>`);
}
function saveName(v){
 v=(v||'').trim().slice(0,20);if(!v){toast('Isi nama dulu.');return false}
 S.name=v;save();closeModal();refresh();toast('Profil tersimpan.');return true;
}

/* aksi */
document.addEventListener('click',e=>{
 const lz=e.target.closest('[data-l]');
 if(lz&&L){
  const a=lz.dataset.l;
  if(a==='opt'){if(L.state!=='ask')return;$$('#l-q .opt').forEach(o=>o.setAttribute('aria-pressed',String(o===lz)));L.sel=lz.dataset.v;enable(true)}
  else if(a==='tok'){if(L.state!=='ask')return;const t=L.cur._tk.find(t=>String(t.i)===lz.dataset.i);L.picked.push(t);drawBank()}
  else if(a==='untok'){if(L.state!=='ask')return;L.picked=L.picked.filter(t=>String(t.i)!==lz.dataset.i);drawBank()}
  else if(a==='pair')onPair(lz);
  else if(a==='say')speak(lz.dataset.t,'id-ID');
  else if(a==='check')check();
  else if(a==='skip')skip();
  else if(a==='next')next();
  else if(a==='quit')askQuit();
  else if(a==='stay'){$('.confirm')?.remove()}
  else if(a==='leave'){endLesson()}
  else if(a==='close')endLesson();
  return;
 }
 const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
 if(a==='bg'){if(e.target===el)closeModal();return}
 if(a==='close')closeModal();
 else if(a==='node')onNode(+el.dataset.gi,el);
 else if(a==='guide')openGuide(+(($('#banner')||{dataset:{}}).dataset.ui||0));
 else if(a==='speak')speak(el.dataset.t,el.dataset.lang);
 else if(a==='claim'){const m=missions().find(m=>m.id===el.dataset.id);if(m&&m.cur>=m.max&&!S.claimed[m.id]){S.claimed[m.id]=1;S.gems+=m.gems;save();sfx.ok();refresh();toast(`+${m.gems} permata`)}}
 else if(a==='buy'){const s=SHOP.find(s=>s.id===el.dataset.id);if(s&&S.gems>=s.p){S.gems-=s.p;if(s.id==='heart')S.hearts=5;else S.shield=Math.min(2,S.shield+1);save();sfx.ok();refresh();toast(s.t+' berhasil dibeli.')}}
 else if(a==='refill'){if(S.gems>=350){S.gems-=350;S.hearts=5;save();closeModal();refresh();toast('Nyawa terisi penuh.')}}
 else if(a==='profile')openProfile();
 else if(a==='saveprofile')saveName($('#prof-name').value);
 else if(a==='savename')saveName($('#name-input').value);
 else if(a==='login')toast('Fitur masuk belum tersedia di versi MVP. Progresmu tersimpan di peramban ini.');
 else if(a==='goal'){S.goal=+el.dataset.v;save();refresh()}
 else if(a==='sound'){S.sound=!S.sound;save();renderView()}
 else if(a==='reset'){armed=true;renderView()}
 else if(a==='reset2'){armed=false;S=DEF();save();refresh();toast('Progres dihapus.')}
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if(L&&L.state!=='end'){$('.confirm')?$('.confirm').remove():askQuit()}else closeModal();return}
 if(e.key==='Enter'){
  const inModal=$('#modal .modal-bg');
  if(inModal&&e.target.id==='prof-name'){e.preventDefault();saveName(e.target.value);return}
  if(!L)return;
  if($('.confirm'))return;
  if(L.state==='ask'){if(L.cur.t!=='pairs'){e.preventDefault();check()}}
  else if(L.state==='end')endLesson();
  else{e.preventDefault();next()}
  return;
 }
 if(L&&L.state==='ask'&&/^[1-9]$/.test(e.key)&&e.target.tagName!=='INPUT'){
  const o=$$('#l-q .opt')[+e.key-1];if(o)o.click();
 }
});
document.addEventListener('input',e=>{if(e.target.id==='typed')enable(e.target.value.trim().length>0)});
window.addEventListener('hashchange',()=>{renderView();markNav();window.scrollTo(0,0)});
window.addEventListener('scroll',syncBanner,{passive:true});
window.addEventListener('resize',syncBanner);

/* mulai */
renderSide();refresh();
{const c=$('.node.current');if(c&&S.lessons>0&&view()==='belajar')c.scrollIntoView({block:'center'})}
})();
</script>

</body></html>
